<!DOCTYPE html>

    <meta charset="UTF-8">

<body>
    <header>
        <h1>Contact Me</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>
    <main>
        <article>
            <h2>Get In Touch</h2>

            <p>
                If you would like to get in touch with me, please fill out the form below.
            </p>
            <form action="#" method="post">
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </p>
                <p>
                    <label for="phone">Phone/Cell:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </p>
                <p>
                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments" rows="6" cols="40" placeholder="Enter your comments" required></textarea>
                </p>
                <p>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Clear Form">  
                </p>
            </form>
        </article>
    </main>
    <footer>
        <p>
            Email:
            <a href="mailto:roger.torriero@ontariotechu.net">
                roger.torriero@ontariotechu.net
            </a>
        </p>

        <p>
            &copy; 2026 Roger Torriero
        </p>
    </footer>
            
</body>
